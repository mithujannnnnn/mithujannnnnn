<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mithujan, Computer Science student">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#101a36"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c7ff"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- slow drifting colour glows -->
    <g filter="url(#blur)">
      <circle cx="200" cy="80" r="130" fill="#4f6bff" opacity="0.55">
        <animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;220;80" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="250" r="140" fill="#19c3a6" opacity="0.40">
        <animate attributeName="cx" values="980;760;980" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;90;250" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="40" r="100" fill="#a45bff" opacity="0.35">
        <animate attributeName="cx" values="640;880;640" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="70" y="148" font-size="84" font-weight="700" letter-spacing="-2" fill="url(#name)">Mithujan</text>
      <text x="72" y="196" font-size="24" font-weight="400" fill="#aab6d8" letter-spacing="0.3">Computer Science student · IIT × University of Westminster</text>

      <!-- live status pill -->
      <g transform="translate(72,230)">
        <rect width="372" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
        <circle cx="26" cy="21" r="5" fill="#2ee6a6">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="26" cy="21" r="5" fill="none" stroke="#2ee6a6">
          <animate attributeName="r" values="5;15" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="48" y="27" font-size="17" fill="#e3e9ff">Building Sarvodaya Connect</text>
      </g>
    </g>

    <!-- orbiting accent on the right -->
    <g transform="translate(990,160)" opacity="0.9">
      <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle r="58" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle r="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <circle cx="92" cy="0" r="7" fill="#7f95ff"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
        <circle cx="58" cy="0" r="6" fill="#2ee6a6"/>
      </g>
    </g>
  </g>
</svg>
