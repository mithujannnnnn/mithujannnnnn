<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Miththujan, Computer Science student">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c3a6"/>
      <stop offset="1" stop-color="#6f86ff"/>
    </linearGradient>
    <linearGradient id="dw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a45bff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="df" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5d5d" stop-opacity="0"/>
    </linearGradient>
    <g id="dragon">
      <!-- far wing -->
      <g opacity="0.65">
        <animateTransform attributeName="transform" type="rotate" values="8 100 56;-14 100 56;8 100 56" dur="1.7s" repeatCount="indefinite"/>
        <path d="M100 56 C 92 30 66 6 34 4 C 50 16 50 26 60 34 C 66 26 76 28 82 40 C 88 34 94 38 98 50 Z" fill="url(#dw)"/>
      </g>
      <!-- tail -->
      <path d="M2 102 C 26 112 54 98 74 84 L 90 66 C 64 84 34 94 2 102 Z" fill="url(#dg)"/>
      <path d="M2 102 L 0 92 L 12 98 Z" fill="#6f86ff"/>
      <!-- legs -->
      <path d="M92 82 L 84 100 L 96 96 L 100 86 Z" fill="url(#dg)"/>
      <path d="M116 80 L 112 98 L 124 92 L 124 80 Z" fill="url(#dg)"/>
      <!-- body -->
      <ellipse cx="102" cy="70" rx="36" ry="17" transform="rotate(-14 102 70)" fill="url(#dg)"/>
      <!-- neck -->
      <path d="M122 62 C 140 58 140 44 150 36 L 162 46 C 152 54 152 72 128 84 Z" fill="url(#dg)"/>
      <!-- back spikes -->
      <path d="M84 54 L 88 44 L 94 54 Z M98 50 L 103 39 L 109 50 Z M113 49 L 119 39 L 124 51 Z M127 46 L 134 37 L 137 49 Z" fill="#a45bff"/>
      <!-- head -->
      <path d="M146 30 L 180 28 L 194 38 L 180 45 L 156 50 Z" fill="url(#dg)"/>
      <path d="M156 50 L 180 45 L 172 52 L 158 54 Z" fill="#3f55d9"/>
      <path d="M150 30 L 136 10 L 158 26 Z" fill="#ffd166"/>
      <path d="M158 28 L 150 14 L 166 26 Z" fill="#ffd166" opacity="0.8"/>
      <circle cx="171" cy="36" r="3.2" fill="#ffffff"/>
      <circle cx="172" cy="36" r="1.4" fill="#0a0f1f"/>
      <!-- near wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 100 56;-20 100 56;0 100 56" dur="1.7s" repeatCount="indefinite"/>
        <path d="M100 58 C 88 24 56 -2 12 6 C 34 20 34 32 48 40 C 54 30 68 32 76 46 C 84 40 92 44 96 56 Z" fill="url(#dw)"/>
        <path d="M100 58 C 80 36 50 14 12 6 M100 58 C 84 44 62 36 48 40 M100 58 C 90 50 80 46 76 46" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>
      </g>
      <!-- fire breath -->
      <g>
        <path d="M194 38 C 206 32 218 34 232 38 C 218 42 206 44 194 38 Z" fill="url(#df)">
          <animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.9s" repeatCount="indefinite"/>
        </path>
        <circle cx="208" cy="38" r="2.4" fill="#ffd166">
          <animate attributeName="cx" values="198;236" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="206" cy="36" r="1.8" fill="#ff9f5d">
          <animate attributeName="cx" values="198;230" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1028"/><stop offset="1" stop-color="#16225a"/>
    </linearGradient>
    <linearGradient id="tth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8d2ff"/>
    </linearGradient>
    <filter id="blh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="grh" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="cph"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#cph)">
    <rect width="1200" height="360" fill="url(#bgh)"/>
    <rect width="1200" height="360" fill="url(#grh)"/>
    <g filter="url(#blh)">
      <circle cx="140" cy="108" r="324" fill="#4f6bff" opacity="0.5">
        <animate attributeName="cx" values="140;360;140" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="288" r="324" fill="#19c3a6" opacity="0.38">
        <animate attributeName="cx" values="1040;800;1040" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="90" cy="40" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="300" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="70" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="320" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5s" begin="0.8999999999999999s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="290" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="60" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" begin="1.7999999999999998s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="310" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="90" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="190" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" begin="2.6999999999999997s" repeatCount="indefinite"/></circle>
    <g transform="translate(850,52) scale(1.42)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-12;0,0" dur="4s" repeatCount="indefinite"/>
      <use href="#dragon" xlink:href="#dragon"/>
    </g>
    <g opacity="0.55">
      <g transform="translate(0,270) scale(0.5)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="-260,0;2600,0" dur="26s" repeatCount="indefinite"/>
        <use href="#dragon" xlink:href="#dragon"/>
      </g>
    </g>
    <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="70" y="160" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#tth)">Miththujan</text>
      <text x="74" y="212" font-size="25" fill="#b4c0e6" letter-spacing="0.3">Computer Science student · IIT × University of Westminster</text>
      <g transform="translate(74,250)">
        <rect width="372" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <circle cx="28" cy="22" r="5" fill="#2ee6a6"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="28" cy="22" r="5" fill="none" stroke="#2ee6a6"><animate attributeName="r" values="5;16" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/></circle>
        <text x="50" y="28" font-size="17" fill="#e6ecff">Building Sarvodaya Connect</text>
      </g>
    </g>
  </g>
</svg>
